name: Setup Patina QEMU Validation

description: >-
  Clone dependency repos into caller-specified directories, build
  patina-dxe-core-qemu with a crate patch, and sparse-checkout the
  patina-qemu run script.  Every path is supplied by the caller — this
  action never assumes where anything lives. Rust tooling is installed
  from the integration repository's rust-toolchain.toml before building.
  Requires Python 3.11 or newer on PATH.

inputs:
  patina-repo:
    description: >-
      Absolute path to the patina repository root (used for crate patch).
      When empty, no crate patch is applied and patina dependencies resolve
      from the registry.
    required: false
    default: ''
  deps-dir:
    description: Absolute path to the parent directory for cloned dependency repos.
    required: true
  dxe-core-qemu-ref:
    description: >-
      Branch, tag, or commit SHA to checkout for patina-dxe-core-qemu.
      Ignored when dxe-core-qemu-repo already exists (e.g. when the caller
      checked it out to the workspace). Defaults to the repo default branch.
    required: false
    default: ''
  dxe-core-qemu-repo:
    description: Absolute path where patina-dxe-core-qemu should be cloned.
    required: true
  fw-patcher-repo:
    description: >-
      Absolute path where patina-fw-patcher should be cloned.
      When empty, the firmware patcher checkout is skipped.
    required: false
    default: ''
  patina-qemu-repo:
    description: >-
      Absolute path where patina-qemu should be sparse-cloned.
      When empty, the QEMU runner checkout is skipped.
    required: false
    default: ''
  log-file:
    description: >-
      Absolute path to a log file. When set, build output is teed to this
      file so that it is available as an artifact even when the build fails.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Clone patina-dxe-core-qemu
      shell: bash
      env:
        DXE_REF: ${{ inputs.dxe-core-qemu-ref }}
      run: |
        set -euo pipefail
        if [ ! -d "${{ inputs.dxe-core-qemu-repo }}" ]; then
          git clone https://github.com/OpenDevicePartnership/patina-dxe-core-qemu.git \
            "${{ inputs.dxe-core-qemu-repo }}"
          if [ -n "$DXE_REF" ]; then
            cd "${{ inputs.dxe-core-qemu-repo }}"
            git fetch origin "$DXE_REF"
            git checkout FETCH_HEAD
          fi
        fi

    - name: Install QEMU Rust Tools
      uses: OpenDevicePartnership/patina-devops/.github/actions/rust-tool-cache@main
      with:
        rust-toolchain-file: ${{ inputs.dxe-core-qemu-repo }}/rust-toolchain.toml

    - name: Clone patina-fw-patcher
      if: inputs.fw-patcher-repo != ''
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d "${{ inputs.fw-patcher-repo }}" ]; then
          git clone https://github.com/OpenDevicePartnership/patina-fw-patcher.git \
            "${{ inputs.fw-patcher-repo }}"
        fi
        chmod +x "${{ inputs.fw-patcher-repo }}/Executables/"*

    - name: Sparse-checkout patina-qemu build script
      if: inputs.patina-qemu-repo != ''
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d "${{ inputs.patina-qemu-repo }}" ]; then
          git clone --filter=blob:none --sparse --depth=1 \
            --branch main \
            https://github.com/OpenDevicePartnership/patina-qemu.git \
            "${{ inputs.patina-qemu-repo }}"
          cd "${{ inputs.patina-qemu-repo }}"
          # MSYS_NO_PATHCONV prevents Git Bash (MSYS2) on Windows from
          # converting the leading '/' in sparse-checkout patterns into
          # Windows paths (e.g. C:/build_and_run_rust_binary.py).  The
          # variable is harmless on Linux.
          MSYS_NO_PATHCONV=1 git sparse-checkout set --no-cone /build_and_run_rust_binary.py /Platforms/Common/Qemu
        fi

    - name: Build patina-dxe-core-qemu with PR Changes
      shell: bash
      env:
        BUILD_LOG_FILE: ${{ inputs.log-file }}
        CARGO_INCREMENTAL: "0"
        PATINA_REPO: ${{ inputs.patina-repo }}
      run: |
        set -euo pipefail

        # Ensure the log directory exists before tee attempts to write.
        if [ -n "$BUILD_LOG_FILE" ]; then
          mkdir -p "$(dirname "$BUILD_LOG_FILE")"
        fi

        # When a log file is configured, tee stdout+stderr to it so the
        # build output is captured in the artifact even on failure.
        run_cmd() {
          if [ -n "$BUILD_LOG_FILE" ]; then
            "$@" 2>&1 | tee -a "$BUILD_LOG_FILE"
          else
            "$@"
          fi
        }

        cd "${{ inputs.dxe-core-qemu-repo }}"

        # When a patina repo path is provided, apply a crate patch so that
        # the build uses the local (potentially unreleased) patina source.
        # Otherwise, dependencies resolve from the registry as-is.
        if [ -n "$PATINA_REPO" ]; then
          run_cmd cargo make q35 -- --crate-patch "$PATINA_REPO" --leave-patch --no-build --exclude-features exit_on_patina_test_failure
          run_cmd cargo update
          run_cmd cargo make q35 -- --crate-patch "$PATINA_REPO" --leave-patch --exclude-features exit_on_patina_test_failure
        else
          run_cmd cargo make q35 -- --exclude-features exit_on_patina_test_failure
        fi
        run_cmd cargo make q35-release -- --exclude-features exit_on_patina_test_failure
        run_cmd cargo make armvirt -- --exclude-features exit_on_patina_test_failure
        run_cmd cargo make armvirt-release -- --exclude-features exit_on_patina_test_failure

    - name: Verify Build Sources and Record Metadata
      shell: python
      env:
        DXE_CORE_QEMU_REPO: ${{ inputs.dxe-core-qemu-repo }}
        PATINA_REPO: ${{ inputs.patina-repo }}
      run: |
        import json
        import os
        import pathlib
        import subprocess
        import tomllib

        root = pathlib.Path(os.environ["DXE_CORE_QEMU_REPO"])
        patina_repo = os.environ["PATINA_REPO"]
        if patina_repo:
            manifest = tomllib.loads((root / "Cargo.toml").read_text(encoding="utf-8"))
            patches = manifest["patch"]["crates-io"]
            for name in ("patina", "patina_dxe_core"):
                if "path" not in patches[name]:
                    raise SystemExit(f"Missing local crate patch for {name}")
            lock = tomllib.loads((root / "Cargo.lock").read_text(encoding="utf-8"))
            unpatched = [package["name"] for package in lock["package"]
                         if package["name"] in patches and "source" in package]
            if unpatched:
                raise SystemExit(f"Workspace crates resolved from a registry instead of local patches: {unpatched}")
        def commit(directory):
            return subprocess.check_output(
                ["git", "-C", directory, "-c", f"safe.directory={pathlib.Path(directory).resolve().as_posix()}",
                 "rev-parse", "HEAD"], text=True,
            ).strip()

        metadata = {
            "run_id": int(os.environ["GITHUB_RUN_ID"]),
            "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
            "patina_sha": commit(patina_repo) if patina_repo else "",
            "integration_sha": commit(str(root)),
        }
        (root / "target" / "build-metadata.json").write_text(json.dumps(metadata), encoding="utf-8")
