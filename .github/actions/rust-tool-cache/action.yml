# @file action.yml
#
# An action that caches Rust tools and toolchains. The supplied toolchain file determines
# the cache identity, installation directory, and tools to install.
#
##
# Copyright (c) Microsoft Corporation.
# SPDX-License-Identifier: Apache-2.0
##
name: "Install Rust Tools"
description: "This action loads rust tools and toolchains from cache, or installs them."

inputs:
  rust-toolchain-file:
    description: >-
      Path to rust-toolchain.toml, absolute or relative to the workspace.
      Its contents determine the cache key. Toolchain and Cargo tool installation
      run from its parent directory. Default: `rust-toolchain.toml`.
    required: false
    default: 'rust-toolchain.toml'

runs:
  using: composite
  steps:
    - name: Resolve Rust Toolchain File
      id: toolchain
      shell: bash
      env:
        TOOLCHAIN_FILE: ${{ inputs.rust-toolchain-file }}
      run: |
        set -euo pipefail
        FILE="${TOOLCHAIN_FILE//\\//}"
        if [ ! -f "$FILE" ]; then
          echo "::error::File $FILE not found."
          exit 1
        fi
        DIRECTORY=$(cd "$(dirname "$FILE")" && pwd)
        if [ "$RUNNER_OS" = "Windows" ]; then
          DIRECTORY=$(cygpath -m "$DIRECTORY")
        fi
        HASH=$(sha256sum "$FILE" | cut -d ' ' -f1)
        {
          echo "directory=$DIRECTORY"
          echo "file=$DIRECTORY/$(basename "$FILE")"
          echo "hash=$HASH"
        } >> "$GITHUB_OUTPUT"

    - name: Rust Tool Cache
      id: tool-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.rustup/toolchains/
        key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-${{ steps.toolchain.outputs.hash }}

    # Installs the toolchain specified in the rust-toolchain.toml file if rustup >= 1.28.0
    #
    # if rustup < 1.28.0, this command will fail, but the cargo will automatically install the toolchain in the next
    # step. This is because rustup less than 1.28.0 automatically installs the toolchain if it is not found where as
    # This functionality was removed in 1.28.0 in favor of being able to call rustup toolchain install without the
    # need to specify the toolchain name.
    - name: Install toolchains
      shell: bash
      working-directory: ${{ steps.toolchain.outputs.directory }}
      run: |
        rustup toolchain install
      continue-on-error: true

    - name: Install cargo-binstall
      shell: bash
      working-directory: ${{ steps.toolchain.outputs.directory }}
      run: |
        curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      if: steps.tool-cache.outputs.cache-hit != 'true'

    # Read any tools from rust-toolchain.toml file and installs them
    - name: Install Rust Tools
      shell: bash
      working-directory: ${{ steps.toolchain.outputs.directory }}
      env:
        TOOLCHAIN_FILE: ${{ steps.toolchain.outputs.file }}
      run: |
        FILE="$TOOLCHAIN_FILE"

        if [ ! -f "$FILE" ]; then
          echo "::error::File $FILE not found."
          exit 1
        fi

        if ! grep -q '^\[tools\]' "$FILE"; then
          echo "::warning::[tools] section not found in $FILE."
          exit 1
        fi

        # Extract tools section from rust-toolchain.toml. Read from the [tools] header
        # until (but not including) the next TOML section header.
        sed -n '/^\[tools\]/,/^\[/{ /^\[/d; p; }' "$FILE" | while read -r line; do
          # Skip blank lines and comments
          [ -z "${line//[[:space:]]/}" ] && continue
          case "$line" in \#*) continue ;; esac

          # Only process lines that look like key = value
          case "$line" in *=*) ;; *) continue ;; esac

          # Extract tool name and clean it
          TOOL_NAME=${line%%=*}
          TOOL_NAME=${TOOL_NAME//[[:space:]]/}
          TOOL_NAME="${TOOL_NAME//$'\n'/}"

          # Extract tool version and clean it
          TOOL_VERSION=${line#*=}
          TOOL_VERSION=${TOOL_VERSION//[[:space:]]/}
          TOOL_VERSION=${TOOL_VERSION//\"/}
          TOOL_VERSION="${TOOL_VERSION//$'\n'/}"

          echo ""
          echo "##################################################################"
          echo "Installing $TOOL_NAME@$TOOL_VERSION"
          echo "##################################################################"
          echo ""

          # Attempt to binstall the tool first. If it fails, install it using cargo
          cargo binstall -y $TOOL_NAME --version $TOOL_VERSION --force || cargo install $TOOL_NAME --version $TOOL_VERSION --locked --force
        done
      if: steps.tool-cache.outputs.cache-hit != 'true'
