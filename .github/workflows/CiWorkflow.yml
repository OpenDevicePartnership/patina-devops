name: CI

env:
  CARGO_INCREMENTAL: "0"

on:
  workflow_call:
    inputs:
      build-tasks:
        description: "Comma-separated list of build tasks to run (e.g., 'build,build-x64,build-aarch64')"
        required: false
        default: ""
        type: string
      run-cargo-vet:
        description: "Whether to run cargo vet"
        required: false
        default: true
        type: boolean
      additional-artifacts:
        description: "Additional artifact paths to upload (newline-separated list of paths)"
        required: false
        default: ""
        type: string
      runner-images:
        description: 'JSON array string of runner images to use for the OS matrix (e.g. ["ubuntu-latest", "windows-latest"])'
        required: false
        default: '["ubuntu-latest", "windows-latest", "ubuntu-24.04-arm"]'
        type: string

jobs:
  basic_ci:
    name: Basic Repo CI

    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Repository ✅
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔤 Check Spelling 🔤
        uses: streetsidesoftware/cspell-action@de2a73e963e7443969755b648a1008f77033c5b2 # v8.4.0
        with:
          treat_flagged_words_as_errors: true
          strict: true
          inline: warning
          incremental_files_only: false

      - name: Markdown Linting
        uses: avto-dev/markdown-lint@04d43ee9191307b50935a753da3b775ab695eceb # v1.5.0
        with:
          config: .markdownlint.yaml
          args: "**/*.md"

      # Run the tests that require the rust tools, but not a specific OS.
      - name: 🛠️ Download Rust Tools 🛠️
        uses: OpenDevicePartnership/patina-devops/.github/actions/rust-tool-cache@main

      - name: Run cargo-vet
        if: ${{ inputs.run-cargo-vet }}
        run: cargo make vet

      - name: Run cargo-fmt
        run: cargo make fmt-check

      - name: Run cargo-deny
        run: cargo make deny

      - name: Test Documentation
        run: cargo make doc-test

      - name: Build documentation
        run: cargo make doc

  run:
    name: Rust CI

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ${{ fromJSON(inputs.runner-images) }}

    steps:
      - name: ✅ Checkout Repository ✅
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛠️ Download Rust Tools 🛠️
        uses: OpenDevicePartnership/patina-devops/.github/actions/rust-tool-cache@main

      - name: Run cargo-clippy
        run: cargo make clippy

      - name: Check no-default-features
        run: cargo make check-no-default-features

      - name: 🧪 Run Tests 🧪
        run: cargo make coverage

      - name: Upload Coverage Report
        if: github.repository_owner == 'OpenDevicePartnership'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/lcov.info
          fail_ci_if_error: true

      - name: Run Build Tasks
        if: ${{ inputs.build-tasks != '' }}
        run: |
          IFS=',' read -ra TASKS <<< "${{ inputs.build-tasks }}"
          for task in "${TASKS[@]}"; do
            task=$(echo "$task" | xargs)
            echo "Running cargo make $task"
            cargo make $task
          done
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ runner.os }}-${{ runner.arch }}-ci-artifacts
          path: |
            Cargo.lock
            target/cobertura.xml

      - name: Upload Additional Artifacts
        if: ${{ inputs.additional-artifacts != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ runner.os }}-${{ runner.arch }}-additional-artifacts
          path: ${{ inputs.additional-artifacts }}
          if-no-files-found: warn

  finalize:
    name: Finalize

    needs: [ run ]

    runs-on: ubuntu-latest

    steps:
      - name: Finish
        run: echo "CI Complete"
